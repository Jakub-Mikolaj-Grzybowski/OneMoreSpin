services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oms-backend
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ASPNETCORE_ENVIRONMENT=Production
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_USESTARTTLS=${SMTP_USESTARTTLS}
      - EmailSender__FromName=${EMAIL_FROMNAME:-OneMoreSpin}
      - EmailSender__FromAddress=${EMAIL_FROMADDRESS:-no-reply@onemorespin.jakubg.org}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - CLIENT_URL=${CLIENT_URL:-https://onemorespin.jakubg.org}
      - AllowedOrigins__0=${CLIENT_URL:-https://onemorespin.jakubg.org}
      - AllowedOrigins__1=${FRONTEND_URL:-https://onemorespin.jakubg.org}
      - ASPNETCORE_URLS=http://0.0.0.0:7643
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-onemorespin.jakubg.org}
      - Jwt__Audience=${JWT_AUDIENCE:-onemorespin.jakubg.org}
      - Registration__RequireEmailConfirmation=false
    ports:
      - target: 7643
        published: ${BACKEND_PORT:-7643}
        protocol: tcp
        mode: host
    networks:
      - db-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q '1DDB' /proc/net/tcp /proc/net/tcp6 2>/dev/null"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://onemorespin.jakubg.org/api}
    container_name: oms-frontend
    restart: unless-stopped
    ports:
      - target: 80
        published: ${FRONTEND_PORT:-5173}
        protocol: tcp
        mode: host
    depends_on:
      - backend
    networks:
      - db-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s


networks:
  db-network:
    external: true
    name: db-network